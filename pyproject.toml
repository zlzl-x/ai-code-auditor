[project]
name = "ai-code-auditor"
version = "0.1.0"
description = "AI code security audit platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "jsonschema>=4.0"]

[project.scripts]
ai-auditor = "backend.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: e2e canary scan", "sandbox: requires Docker on Linux/WSL2"]

[tool.coverage.run]
source = ["backend"]

[tool.coverage.report]
fail_under = 80
omit = ["backend/knowledge/cli.py", "backend/api/scan_service.py"]
