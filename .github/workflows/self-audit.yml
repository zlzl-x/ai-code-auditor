name: Self Audit

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  self-audit:
    runs-on: ubuntu-latest
    env:
      LLM_CLIENT: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m "not slow and not sandbox" -q

      - name: Install static analysis tools
        run: pip install semgrep bandit

      - name: Semgrep backend
        run: semgrep --config auto backend/ || true

      - name: Bandit backend
        run: bandit -r backend/ || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: AgentShield config audit
        run: npx ecc-agentshield scan --path . --format json --min-severity medium > agentshield-report.json || true

      - name: Upload AgentShield report
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-report
          path: agentshield-report.json
          if-no-files-found: ignore
