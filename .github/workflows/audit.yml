name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      LLM_CLIENT: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-novel-assistant-v3
          path: baselines/novel-assistant-v3

      - name: Run audit scan
        run: |
          ai-auditor scan \
            --project novel-assistant-v3 \
            --format sarif \
            -o audit.sarif \
            --baseline main \
            --report-mode report_only \
            --pr-comment-out pr-comment.md || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('audit.sarif') != ''
        with:
          sarif_file: audit.sarif

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: |
            audit.sarif
            pr-comment.md
          if-no-files-found: ignore

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('pr-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  update-baseline:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      LLM_CLIENT: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Generate baseline
        run: |
          ai-auditor scan \
            --project novel-assistant-v3 \
            --format json \
            --all-findings \
            --save-baseline main || true

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-novel-assistant-v3
          path: baselines/novel-assistant-v3/main.json
          if-no-files-found: ignore
